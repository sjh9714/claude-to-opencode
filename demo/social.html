<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{width:1280px;height:640px;overflow:hidden;margin:0;background:#0d0f12}
  /* market carousel crops anything wider than ~1.733 ratio, so all content
     lives inside the central 1108px safe zone (86px margins each side) */
  #safe{position:absolute;left:86px;top:0;width:1108px;height:640px;display:flex;flex-direction:column;justify-content:center}
  .from{font:600 34px ui-monospace,Menlo,monospace;color:#6b7383;letter-spacing:.5px}
  .name{font:800 96px ui-monospace,Menlo,monospace;color:#e9edf5;margin:10px 0 6px;letter-spacing:-2px}
  .name .accent{color:#9ecbff}
  .claim{font:600 40px ui-sans-serif,system-ui;color:#c7cede;line-height:1.3;max-width:760px}
  .zh{font:700 40px ui-sans-serif,system-ui;color:#e8c66a;margin-top:10px}
  .cmd{display:inline-block;margin-top:34px;font:600 34px ui-monospace,Menlo,monospace;color:#7ee08a;background:#161a22;border:1px solid #2b3140;border-radius:12px;padding:14px 26px}
  .cmd .dim{color:#6b7383}
  .assets{position:absolute;right:86px;top:64px;font:500 26px ui-monospace,Menlo,monospace;color:#565e6e;text-align:right;line-height:1.9}
</style></head>
<body>
<div id="safe">
  <div class="from">Claude Code + Codex + OpenCode -> DSH</div>
  <div class="name">dsh-<span class="accent">movein</span></div>
  <div class="claim">Move your agent setup into DeepSeek Harness in one command</div>
  <div class="zh">三种来源，一次搬进 DSH</div>
  <div><span class="cmd"><span class="dim">$</span> npx dsh-movein --from opencode</span></div>
</div>
<div class="assets">instructions<br>skills<br>commands<br>agents<br>MCP servers</div>
<script>
window.DURATION=0; window.seek=()=>{};
window.ready=(async()=>{await document.fonts.ready;})();
</script>
</body></html>
